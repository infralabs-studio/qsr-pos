name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qsr_pos
          POSTGRES_USER: qsr_ci
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qsr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    # Throwaway values for an ephemeral CI database. They are not real credentials.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      POSTGRES_DB: qsr_pos
      POSTGRES_USER: qsr_ci
      POSTGRES_PASSWORD: ci-only-throwaway
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
          
      - run: pip install -r requirements/dev.txt
      
      - name: Format (black)
        run: black --check .
        
      - name: Lint (flake8)
        run: flake8
        
      - name: Type check (mypy)
        run: mypy .
        
      - name: Migrations are up to date and committed
        run: python manage.py makemigrations --check --dry-run
        
      - name: Tests
        run: python manage.py test